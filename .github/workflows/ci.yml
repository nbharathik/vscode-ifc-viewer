name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest, Node)
        run: npm test

      # Pixel-snapshot baselines are platform-specific. The committed baselines
      # are for the dev OS (win32); seed Linux baselines once via the
      # "Update snapshots" workflow so this step is green on ubuntu runners.
      - name: E2E tests (Playwright, headless WebGL)
        run: xvfb-run -a npm run test:e2e

      - name: Extension host tests (@vscode/test-electron)
        run: xvfb-run -a npm run test:ext

      - name: Package VSIX
        run: npm run package

      - name: Extension host tests against the packaged build
        run: xvfb-run -a npm run test:ext:packaged -w packages/extension

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            playwright-report/**
            *.vsix
          if-no-files-found: ignore
