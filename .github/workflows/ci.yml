name: CI

# The published repository carries the shipping source, not the test suites or
# the IFC fixtures they load (see .gitignore), so this gate runs the checks a
# fresh clone can actually complete: strict types, lint, and a real package
# build. The full suite (vitest, Playwright, @vscode/test-electron) runs in the
# maintainer tree before each release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: ignore
